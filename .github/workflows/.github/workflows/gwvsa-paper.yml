name: gwvsa-paper
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: gwvsa-paper
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python gwvsa_bot.py paper
      - run: |
          git config user.name "gwvsa-bot"
          git config user.email "gwvsa-bot@users.noreply.github.com"
          git add bot_state.json
          git commit -m "paper state" || echo "no changes"
          git push

