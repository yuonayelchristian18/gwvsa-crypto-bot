name: GWVSA Paper Trading Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gwvsa-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bot
        run: python trade_all.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gwvsa_state.json gwvsa_trades.csv
          [ -d archive ] && git add archive
          git diff --cached --quiet && exit 0
          git commit -m "Update GWVSA paper trading account"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            sleep 10
          done
          exit 1
